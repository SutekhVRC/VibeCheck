[package]
name = "vibecheck-core"
version = "0.1.0"
edition = "2021"
authors = ["SutekhVRC"]
license = "Apache-2.0"
description = "Module runtime for VibeCheck: signal and event planes, module traits and the safety layer"
rust-version = "1.75"

[dependencies]
async-trait = "0.1.92"
buttplug = "9.0.9"
parking_lot = "0.12.5"
tokio = { version = "1.53.3", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["sync", "macros", "rt"] }
